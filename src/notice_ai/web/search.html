<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공지 검색</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0;
    --accent: #2f5bd3; --accent-soft: #e8eefc; --em: #fff2b3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --panel: #202124; --text: #ececec; --muted: #9a9aa0; --line: #33343a;
            --accent: #8fb0ff; --accent-soft: #26304a; --em: #5a4d10; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* .bar·.pager의 display:flex가 hidden 속성을 덮어써 빈 화면에도 보였다 */
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; }
  input[type=search] { flex: 1; min-width: 0; padding: 11px 14px; font-size: 16px; border: 1px solid var(--line);
                       border-radius: 10px; background: var(--panel); color: var(--text); }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); padding: 9px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 0 10px; }
  .summary { color: var(--muted); }
  .summary b { color: var(--text); }
  .sort button { padding: 5px 10px; font-size: 13px; }
  .sort button[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chips button { padding: 4px 10px; font-size: 13px; border-radius: 999px; }
  .chips button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  ol { list-style: none; margin: 0; padding: 0; }
  li.hit { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; margin-bottom: 8px; }
  li.hit a { color: var(--text); font-weight: 600; text-decoration: none; }
  li.hit a:hover { color: var(--accent); text-decoration: underline; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; font-size: 12.5px; color: var(--muted); }
  .tag { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 6px; }
  .snippet { margin-top: 6px; font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
  .snippet em { font-style: normal; background: var(--em); color: var(--text); border-radius: 3px; padding: 0 1px; }
  .pager { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 16px 0; color: var(--muted); }
  section.related { margin-top: 26px; }
  section.related h2 { font-size: 15px; margin: 0 0 4px; }
  section.related p { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .note { padding: 18px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>공지 검색</h1>
  <form id="f" role="search">
    <input id="q" type="search" placeholder="코인명·티커·키워드 또는 문장으로 검색 (예: 헤데라, hbar, 이용약관 개정)" autocomplete="off" autofocus>
    <button class="primary" type="submit">검색</button>
  </form>

  <div id="bar" class="bar" hidden>
    <div id="summary" class="summary"></div>
    <div class="sort" role="group" aria-label="정렬">
      <button type="button" data-sort="relevance">관련도순</button>
      <button type="button" data-sort="recent">최신순</button>
    </div>
  </div>
  <div id="chips" class="chips"></div>
  <div id="status" class="note" hidden></div>
  <ol id="hits"></ol>
  <div id="pager" class="pager" hidden>
    <button type="button" id="prev">이전</button><span id="pageinfo"></span><button type="button" id="next">다음</button>
  </div>

  <section id="related" class="related" hidden>
    <h2>비슷한 공지</h2>
    <p>위 목록에 없거나 뒤쪽에 있지만 검색어와 뜻이 가까운 공지입니다(의미 검색).</p>
    <ol id="relatedHits"></ol>
  </section>
</main>
<script>
const SIZE = 10;
const state = { q: "", category: "", sort: "relevance", page: 1, allTotal: null };
const $ = (id) => document.getElementById(id);

function fromUrl() {
  const p = new URLSearchParams(location.search);
  state.q = p.get("q") || "";
  state.category = p.get("category") || "";
  state.sort = p.get("sort") === "recent" ? "recent" : "relevance";
  state.page = Math.max(1, parseInt(p.get("page") || "1", 10) || 1);
}

function toUrl() {
  const p = new URLSearchParams({ q: state.q });
  if (state.category) p.set("category", state.category);
  if (state.sort !== "relevance") p.set("sort", state.sort);
  if (state.page > 1) p.set("page", state.page);
  history.replaceState(null, "", "?" + p.toString());
}

function hitItem(h) {
  const li = document.createElement("li");
  li.className = "hit";
  const a = document.createElement("a");
  a.href = h.source_url; a.target = "_blank"; a.rel = "noopener"; a.textContent = h.title;
  const meta = document.createElement("div");
  meta.className = "meta";
  const date = document.createElement("span");
  date.textContent = (h.published_at || "").slice(0, 10).replaceAll("-", ".");
  meta.append(date);
  for (const c of h.categories) {
    const t = document.createElement("span"); t.className = "tag"; t.textContent = c; meta.append(t);
  }
  li.append(a, meta);
  if (h.snippet) {
    const s = document.createElement("div");
    s.className = "snippet";
    s.innerHTML = h.snippet;   // 서버가 HTML 이스케이프한 발췌(<em>만 포함)
    li.append(s);
  }
  return li;
}

function renderChips(categories) {
  const box = $("chips");
  box.replaceChildren();
  const entries = Object.entries(categories);
  if (!entries.length && !state.category) return;
  const all = document.createElement("button");
  all.type = "button";
  all.textContent = state.allTotal != null ? `전체 ${state.allTotal}` : "전체";
  all.setAttribute("aria-pressed", String(!state.category));
  all.onclick = () => { state.category = ""; state.page = 1; run(); };
  box.append(all);
  for (const [name, n] of entries) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = `${name} ${n}`;
    b.setAttribute("aria-pressed", String(state.category === name));
    b.onclick = () => { state.category = name; state.page = 1; run(); };
    box.append(b);
  }
}

async function run() {
  if (!state.q) return;
  toUrl();
  $("q").value = state.q;
  $("status").hidden = false;
  $("status").textContent = "검색 중…";
  const p = new URLSearchParams({ q: state.q, page: state.page, size: SIZE, sort: state.sort });
  if (state.category) p.set("category", state.category);
  let r;
  try {
    const res = await fetch("search?" + p.toString());
    if (!res.ok) throw new Error(res.status);
    r = await res.json();
  } catch (e) {
    $("status").textContent = "검색 서버에 연결하지 못했습니다. 잠시 뒤 다시 시도하세요.";
    return;
  }
  if (!state.category) state.allTotal = r.total;

  $("bar").hidden = false;
  $("summary").innerHTML = "";
  const b = document.createElement("b"); b.textContent = `'${r.query}'`;
  $("summary").append(b, ` 검색 결과 ${r.total.toLocaleString()}건` + (state.category ? ` · ${state.category}` : ""));
  document.querySelectorAll(".sort button").forEach((x) =>
    x.setAttribute("aria-pressed", String(x.dataset.sort === state.sort)));
  renderChips(r.categories);

  $("hits").replaceChildren(...r.hits.map(hitItem));
  $("status").hidden = r.hits.length > 0;
  $("status").textContent = r.hits.length ? "" : "검색어가 들어간 공지가 없습니다.";

  const pages = Math.max(1, Math.ceil(r.total / SIZE));
  $("pager").hidden = pages <= 1;
  $("pageinfo").textContent = `${state.page} / ${pages}쪽`;
  $("prev").disabled = state.page <= 1;
  $("next").disabled = state.page >= pages;

  $("related").hidden = !r.related.length;
  $("relatedHits").replaceChildren(...r.related.map(hitItem));
}

$("f").onsubmit = (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  if (q !== state.q) { state.category = ""; state.allTotal = null; }
  Object.assign(state, { q, page: 1 });
  run();
};
document.querySelectorAll(".sort button").forEach((x) =>
  x.onclick = () => { state.sort = x.dataset.sort; state.page = 1; run(); });
$("prev").onclick = () => { state.page -= 1; run(); window.scrollTo(0, 0); };
$("next").onclick = () => { state.page += 1; run(); window.scrollTo(0, 0); };

fromUrl();
run();
</script>
</body>
</html>
